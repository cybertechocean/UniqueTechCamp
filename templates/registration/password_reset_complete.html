{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete | UniqueTechCamp{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-16 px-4 sm:px-6 lg:px-8 bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 relative overflow-hidden">
    <div class="absolute -top-32 -left-32 w-80 h-80 bg-primary/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-md w-full relative z-10 text-center">
        <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-8 md:p-10 shadow-2xl backdrop-blur-md">
            <div class="w-16 h-16 rounded-2xl bg-primary/20 border border-primary/40 flex items-center justify-center mx-auto mb-6 text-primary">
                <i data-lucide="shield-check" class="w-8 h-8"></i>
            </div>
            
            <h1 class="text-2xl font-heading font-extrabold text-white mb-3">Password Updated!</h1>
            <p class="text-sm text-gray-300 font-body mb-8 leading-relaxed">
                Your new password has been set successfully. You can now use your updated credentials to log into your account.
            </p>

            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <a href="{% url 'admin:login' %}" class="btn-primary py-3 px-6 rounded-xl text-xs font-semibold inline-flex items-center justify-center gap-2 shadow-lg shadow-primary/20">
                    <i data-lucide="log-in" class="w-4 h-4"></i> Log In Now
                </a>
                <a href="{% url 'core:home' %}" class="btn-secondary py-3 px-6 rounded-xl text-xs font-semibold inline-flex items-center justify-center gap-2">
                    <i data-lucide="home" class="w-4 h-4"></i> Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
