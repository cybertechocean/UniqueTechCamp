{% load static %}
{% if '/ai-assistant/' not in request.path %}
<!-- ========================================================================== -->
<!-- Ultra-Modern Floating AI Client Acquisition & Booking Desk Widget -->
<!-- Positioned Vertically Above the Bottom-Right Support Desk (Zero Overlap) -->
<!-- ========================================================================== -->

<style>
    #utc-ai-widget-wrapper {
        position: fixed !important;
        bottom: 100px !important;
        right: 32px !important;
        z-index: 99999 !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: flex-end !important;
        pointer-events: none !important;
    }
    @media (max-width: 1024px) {
        #utc-ai-widget-wrapper {
            bottom: 152px !important;
            right: 16px !important;
        }
    }
</style>

<div id="utc-ai-widget-wrapper">

    <!-- Floating AI Chat Container Modal -->
    <div id="utc-ai-modal" 
         class="hidden pointer-events-auto mb-3 w-[92vw] sm:w-[390px] max-w-[420px] h-[550px] max-h-[82vh] rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.8)] flex flex-col overflow-hidden text-slate-100 transition-all duration-300 transform origin-bottom-right"
         style="background-color: rgba(11, 15, 25, 0.98); backdrop-filter: blur(20px); border: 1px solid rgba(71, 85, 105, 0.8);">
        
        <!-- Header -->
        <div class="px-4 py-3.5 bg-slate-950 border-b border-slate-800 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 p-0.5 shadow-md flex items-center justify-center">
                        <img src="{% static 'images/logo-icon.png' %}" alt="UTC AI" class="w-full h-full rounded-[10px] object-cover bg-slate-950">
                    </div>
                    <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-emerald-400 border-2 border-slate-950"></span>
                </div>
                <div>
                    <div class="flex items-center gap-1.5">
                        <h4 class="text-xs font-bold text-white tracking-tight">UniqueTechCamp AI</h4>
                        <span class="px-1.5 py-0.2 rounded-full bg-emerald-500/20 text-emerald-400 text-[9px] font-black border border-emerald-500/40">24/7 EAT</span>
                    </div>
                    <p class="text-[10px] text-slate-400 font-medium">Architecture & Booking Desk</p>
                </div>
            </div>
            <div class="flex items-center gap-1">
                <!-- Expand to Dedicated Workspace -->
                <a href="{% url 'ai_assistant:index' %}" 
                   class="p-1.5 text-slate-400 hover:text-emerald-400 hover:bg-slate-800/80 rounded-lg transition-colors" 
                   title="Expand to Full Page Workspace" 
                   aria-label="Expand Chat to Full Page">
                    <i data-lucide="maximize-2" class="w-4 h-4"></i>
                </a>
                <!-- Close / Minimize -->
                <button type="button" 
                        id="utc-ai-close-btn" 
                        class="p-1.5 text-slate-400 hover:text-white hover:bg-slate-800/80 rounded-lg transition-colors cursor-pointer" 
                        aria-label="Close AI Chat">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- Scrollable Chat Stream -->
        <div id="utc-ai-messages" class="flex-1 p-3.5 space-y-3 overflow-y-auto font-sans text-xs select-text scroll-smooth"
             style="background: radial-gradient(circle at top right, rgba(16, 185, 129, 0.04), transparent 40%), #0B0F19;">
            <div class="text-center py-4 text-slate-400 text-[11px] flex items-center justify-center gap-2">
                <span class="w-3.5 h-3.5 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></span>
                <span>Connecting to AI Architecture Desk...</span>
            </div>
        </div>

        <!-- Dynamic Quick Suggestion Chips -->
        <div id="utc-ai-chips-bar" class="px-3 py-1.5 bg-slate-950/90 border-t border-slate-800/80 flex items-center gap-1.5 overflow-x-auto shrink-0 scrollbar-none">
            <button type="button" class="utc-quick-chip px-2.5 py-1 rounded-full bg-slate-800/90 hover:bg-emerald-500/20 text-slate-300 hover:text-emerald-300 border border-slate-700/80 text-[10px] font-medium whitespace-nowrap transition-all cursor-pointer shadow-sm" data-text="What does a 24/7 AI WhatsApp Agent cost and how does it work?">
                🤖 WhatsApp AI Agent
            </button>
            <button type="button" class="utc-quick-chip px-2.5 py-1 rounded-full bg-slate-800/90 hover:bg-emerald-500/20 text-slate-300 hover:text-emerald-300 border border-slate-700/80 text-[10px] font-medium whitespace-nowrap transition-all cursor-pointer shadow-sm" data-text="Tell me about your Clinic & Healthcare Management Systems.">
                🏥 Clinic System
            </button>
            <button type="button" class="utc-quick-chip px-2.5 py-1 rounded-full bg-slate-800/90 hover:bg-emerald-500/20 text-slate-300 hover:text-emerald-300 border border-slate-700/80 text-[10px] font-medium whitespace-nowrap transition-all cursor-pointer shadow-sm" data-text="I want to schedule a free 1-on-1 technical discovery consultation.">
                📅 Book Consultation
            </button>
            <button type="button" class="utc-quick-chip px-2.5 py-1 rounded-full bg-slate-800/90 hover:bg-emerald-500/20 text-slate-300 hover:text-emerald-300 border border-slate-700/80 text-[10px] font-medium whitespace-nowrap transition-all cursor-pointer shadow-sm" data-text="Do your e-commerce stores integrate M-Pesa Daraja STK Push?">
                💳 M-Pesa E-Commerce
            </button>
        </div>

        <!-- Input Bar -->
        <form id="utc-ai-input-form" class="p-2.5 bg-slate-950 border-t border-slate-800 flex items-center gap-2 shrink-0">
            {% csrf_token %}
            <input type="text" 
                   id="utc-ai-query-input" 
                   placeholder="Ask about systems, pricing, or book a call..." 
                   autocomplete="off"
                   class="flex-1 px-3.5 py-2 text-xs rounded-xl bg-slate-900 border border-slate-700 text-white placeholder:text-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all shadow-inner">
            <button type="submit" 
                    id="utc-ai-send-btn" 
                    class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-green-400 hover:from-emerald-400 hover:to-green-300 text-slate-950 font-bold flex items-center justify-center transition-all shadow-md active:scale-95 cursor-pointer shrink-0 disabled:opacity-50"
                    aria-label="Send Message">
                <i data-lucide="send" class="w-4 h-4"></i>
            </button>
        </form>

        <!-- Bottom Actions Bar: Email Transcript & WhatsApp (Moved below send button) -->
        <div class="px-3 py-2 bg-slate-950 border-t border-slate-800/80 flex items-center justify-between text-[11px] shrink-0">
            <div class="flex items-center gap-1.5">
                <button type="button" 
                        id="utc-ai-email-transcript-btn" 
                        class="px-2 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700/80 text-slate-300 hover:text-emerald-400 transition-colors flex items-center gap-1 cursor-pointer text-[10px] font-semibold"
                        title="Email Consultation Transcript">
                    <i data-lucide="mail" class="w-3 h-3 text-emerald-400"></i>
                    <span>Email Transcript</span>
                </button>
                <span id="utc-widget-transcript-status" class="text-[10px] text-emerald-400 font-bold hidden"></span>
            </div>

            <a href="https://wa.me/254715479955?text=Hello%20UniqueTechCamp!%20I%20am%20chatting%20with%20your%20AI%20Solutions%20Desk." 
               target="_blank"
               rel="noopener noreferrer"
               class="px-2 py-1 rounded-lg bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/30 text-emerald-400 transition-colors flex items-center gap-1 text-[10px] font-bold"
               title="Direct WhatsApp with Senior Software Architect">
                <i class="fa-brands fa-whatsapp text-xs text-[#25D366]"></i>
                <span>WhatsApp</span>
            </a>
        </div>
    </div>

    <!-- Floating Launcher Trigger Button (Stacked Vertically Above Support Desk) -->
    <button type="button" 
            id="utc-ai-launcher-btn" 
            class="pointer-events-auto w-14 h-14 bg-gradient-to-tr from-[#00E676] via-emerald-500 to-teal-400 text-slate-950 font-extrabold rounded-full flex items-center justify-center shadow-[0_10px_30px_rgba(0,230,118,0.4)] hover:shadow-[0_15px_40px_rgba(0,230,118,0.6)] hover:scale-105 active:scale-95 transition-all duration-300 ring-4 ring-emerald-500/20 cursor-pointer relative group"
            aria-expanded="false" 
            aria-label="Open 24/7 AI Solutions Architect & Booking Desk"
            title="Ask AI Solutions Architect (24/7 Support & Bookings)">
        
        <!-- Animated Luminous Pulse Ring -->
        <span class="absolute -inset-1 rounded-full bg-[#00E676] opacity-30 group-hover:opacity-60 blur-md animate-pulse pointer-events-none"></span>
        
        <!-- Online Green Dot Indicator -->
        <span class="absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full bg-[#00E676] border-2 border-slate-900 animate-ping"></span>
        <span class="absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full bg-[#00E676] border-2 border-slate-900"></span>

        <!-- AI Floating Tooltip Pill (Shows on Desktop Hover) -->
        <span class="absolute right-16 px-3 py-1 rounded-xl bg-slate-900/95 border border-slate-700 text-emerald-400 text-[11px] font-bold whitespace-nowrap shadow-xl opacity-0 group-hover:opacity-100 transition-all pointer-events-none hidden md:flex items-center gap-1.5">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-emerald-400"></i>
            <span>Ask AI • 24/7 Solutions Desk</span>
        </span>

        <!-- Icon Toggle -->
        <div class="relative z-10 flex items-center justify-center text-slate-950">
            <i data-lucide="sparkles" id="utc-ai-icon-open" class="w-6 h-6 stroke-[2.4]"></i>
            <i data-lucide="x" id="utc-ai-icon-close" class="w-6 h-6 stroke-[2.4] hidden"></i>
        </div>
    </button>
</div>

<!-- Frontend Controller Logic -->
<script>
(function() {
    let currentSessionId = localStorage.getItem('utc_ai_session_id') || '';
    let hasCapturedLead = false;
    let isFetching = false;

    const modal = document.getElementById('utc-ai-modal');
    const launcher = document.getElementById('utc-ai-launcher-btn');
    const closeBtn = document.getElementById('utc-ai-close-btn');
    const iconOpen = document.getElementById('utc-ai-icon-open');
    const iconClose = document.getElementById('utc-ai-icon-close');
    const messagesBox = document.getElementById('utc-ai-messages');
    const inputForm = document.getElementById('utc-ai-input-form');
    const queryInput = document.getElementById('utc-ai-query-input');
    const sendBtn = document.getElementById('utc-ai-send-btn');
    const emailTranscriptBtn = document.getElementById('utc-ai-email-transcript-btn');

    function getCsrfToken() {
        const field = inputForm ? inputForm.querySelector('input[name="csrfmiddlewaretoken"]') : null;
        return field ? field.value : '';
    }

    function scrollToBottom() {
        if (messagesBox) messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    // Comprehensive Markdown and Formatting Parser
    function formatChatMarkdown(raw) {
        if (!raw) return '';
        
        let text = raw
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
        
        // Code blocks
        const codeBlocks = [];
        text = text.replace(/```(?:[a-zA-Z]*\n)?([\s\S]*?)```/g, (match, code) => {
            const placeholder = `__CODE_BLOCK_${codeBlocks.length}__`;
            codeBlocks.push(`<pre class="my-2 p-2.5 rounded-xl bg-slate-950 border border-slate-700/80 font-mono text-[11px] text-emerald-300 overflow-x-auto shadow-inner"><code>${code.trim()}</code></pre>`);
            return placeholder;
        });

        // Inline code
        text = text.replace(/`([^`]+)`/g, '<code class="px-1 py-0.5 rounded bg-slate-800 text-emerald-300 font-mono text-[10px] border border-slate-700/60">$1</code>');

        // Markdown links [text](url)
        text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" class="text-emerald-400 hover:text-emerald-300 font-bold underline transition-colors inline-flex items-center gap-0.5">$1 <svg class="w-3 h-3 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg></a>');

        // Raw URLs
        text = text.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)(?=[)\s]|$)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer" class="text-emerald-400 hover:text-emerald-300 underline font-medium transition-colors break-all">$2</a>');

        // Headers
        text = text.replace(/^### (.*$)/gim, '<h4 class="text-xs font-bold text-emerald-400 mt-2 mb-1 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>$1</h4>');
        text = text.replace(/^## (.*$)/gim, '<h3 class="text-xs font-extrabold text-white mt-2.5 mb-1">$1</h3>');

        // Bold & Italic
        text = text.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-white">$1</strong>');
        text = text.replace(/__([^_]+)__/g, '<strong class="font-bold text-white">$1</strong>');
        text = text.replace(/\*([^*]+)\*/g, '<em class="italic text-slate-200">$1</em>');

        // Blockquotes
        text = text.replace(/^&gt; (.*$)/gim, '<blockquote class="my-1.5 pl-2.5 border-l-2 border-emerald-500 bg-emerald-950/20 py-0.5 text-emerald-200 text-[11px] italic">$1</blockquote>');

        // Lists
        const lines = text.split('\n');
        let inUl = false;
        let inOl = false;
        const processed = [];

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i];
            const ulMatch = line.match(/^(\s*)[*+-]\s+(.*)$/);
            const olMatch = line.match(/^(\s*)\d+\.\s+(.*)$/);

            if (ulMatch) {
                if (inOl) { processed.push('</ol>'); inOl = false; }
                if (!inUl) { processed.push('<ul class="my-1.5 space-y-1 pl-3.5 list-disc marker:text-emerald-400 text-slate-100 text-xs">'); inUl = true; }
                processed.push(`<li>${ulMatch[2]}</li>`);
            } else if (olMatch) {
                if (inUl) { processed.push('</ul>'); inUl = false; }
                if (!inOl) { processed.push('<ol class="my-1.5 space-y-1 pl-4 list-decimal marker:text-emerald-400 marker:font-bold text-slate-100 text-xs">'); inOl = true; }
                processed.push(`<li>${olMatch[2]}</li>`);
            } else {
                if (inUl) { processed.push('</ul>'); inUl = false; }
                if (inOl) { processed.push('</ol>'); inOl = false; }
                processed.push(line);
            }
        }
        if (inUl) processed.push('</ul>');
        if (inOl) processed.push('</ol>');

        text = processed.join('\n');
        text = text.replace(/\n\n+/g, '<div class="my-1.5"></div>');
        text = text.replace(/\n/g, '<br>');

        codeBlocks.forEach((b, idx) => {
            text = text.replace(`__CODE_BLOCK_${idx}__`, b);
        });

        return text;
    }

    function renderMessage(msg) {
        const isUser = msg.sender === 'user';
        const bubble = document.createElement('div');
        bubble.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'} animate-fade-in w-full`;

        const nameLabel = isUser ? 'You' : 'UniqueTechCamp AI';
        const headerColor = isUser ? 'text-slate-400' : 'text-emerald-400';

        let contentHtml = '';
        if (isUser) {
            contentHtml = `
                <div class="flex items-center gap-1.5 mb-1 px-1">
                    <span class="text-[10px] font-semibold ${headerColor}">${nameLabel}</span>
                    <span class="text-[9px] text-slate-500">${msg.created_at || ''}</span>
                </div>
                <div class="p-3 rounded-2xl rounded-tr-none max-w-[88%] text-xs leading-relaxed break-words shadow-md"
                     style="background: linear-gradient(135deg, #059669 0%, #0d9488 100%) !important; color: #FFFFFF !important; border: 1px solid rgba(16, 185, 129, 0.4) !important;">
                    ${formatChatMarkdown(msg.message)}
                </div>
            `;
        } else {
            contentHtml = `
                <div class="flex items-center gap-1.5 mb-1 px-1">
                    <div class="w-4 h-4 rounded bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-[9px]">
                        <i data-lucide="bot" class="w-2.5 h-2.5"></i>
                    </div>
                    <span class="text-[10px] font-bold ${headerColor}">${nameLabel}</span>
                    <span class="text-[9px] text-slate-500">${msg.created_at || ''}</span>
                </div>
                <div class="p-3.5 rounded-2xl rounded-tl-none max-w-[92%] text-xs leading-relaxed break-words shadow-xl"
                     style="background-color: #111827 !important; color: #F8FAFC !important; border: 1px solid rgba(71, 85, 105, 0.7) !important;">
                    ${formatChatMarkdown(msg.message)}
                </div>
            `;
        }

        let innerContent = contentHtml;

        // Lead Form Card
        if (msg.action_type === 'lead_form' && !hasCapturedLead) {
            innerContent += renderLeadFormCard();
        }

        // Slot Picker Card
        if (msg.action_type === 'slot_picker' && msg.metadata && msg.metadata.dates) {
            innerContent += renderSlotPickerCard(msg.metadata.dates);
        }

        // Booking Card
        if (msg.action_type === 'booking_card' && msg.metadata) {
            innerContent += renderBookingConfirmedCard(msg.metadata);
        }

        bubble.innerHTML = innerContent;
        messagesBox.appendChild(bubble);
        if (window.lucide) lucide.createIcons();
        scrollToBottom();
    }

    function renderLeadFormCard() {
        return `
            <div class="mt-2.5 p-3 rounded-2xl max-w-[94%] shadow-xl animate-fade-in text-left"
                 style="background-color: #0B0F19; border: 1px solid rgba(16, 185, 129, 0.5);">
                <div class="flex items-center gap-1.5 mb-2 text-emerald-400 font-bold text-[11px]">
                    <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
                    <span>Official Consultation Registration</span>
                </div>
                <p class="text-[10px] text-slate-300 mb-2.5 leading-snug">
                    Enter your details to receive your customized digital roadmap and full session transcript.
                </p>
                <form class="utc-lead-form space-y-2">
                    <input type="text" name="full_name" placeholder="Full Name *" required 
                           class="w-full px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-white text-xs placeholder:text-slate-500 focus:outline-none focus:border-emerald-500">
                    <input type="email" name="email" placeholder="Official Email Address *" required 
                           class="w-full px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-white text-xs placeholder:text-slate-500 focus:outline-none focus:border-emerald-500">
                    <input type="tel" name="phone" placeholder="WhatsApp / Phone (e.g. +254 715...) *" required 
                           class="w-full px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-white text-xs placeholder:text-slate-500 focus:outline-none focus:border-emerald-500">
                    <button type="submit" class="w-full py-2 px-3 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs flex items-center justify-center gap-1.5 transition-colors cursor-pointer shadow-md">
                        <i data-lucide="check" class="w-3.5 h-3.5"></i>
                        <span>Continue Conversation</span>
                    </button>
                </form>
            </div>
        `;
    }

    function renderSlotPickerCard(dates) {
        let html = `
            <div class="mt-2.5 p-3 rounded-2xl max-w-[94%] shadow-xl animate-fade-in text-left"
                 style="background-color: #0B0F19; border: 1px solid rgba(56, 189, 248, 0.5);">
                <div class="flex items-center gap-1.5 mb-2 text-sky-400 font-bold text-[11px]">
                    <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                    <span>Select 1-Hour Consultation Slot (EAT)</span>
                </div>
                <div class="space-y-2 max-h-56 overflow-y-auto pr-1">
        `;
        dates.forEach(d => {
            html += `
                <div class="p-2 rounded-xl bg-slate-900/90 border border-slate-800">
                    <div class="text-[10px] font-bold text-slate-300 mb-1.5 flex items-center justify-between">
                        <span>${d.date_display || d.date_str}</span>
                        <span class="text-[9px] text-emerald-400 font-semibold px-1.5 py-0.2 rounded-full bg-emerald-500/10 border border-emerald-500/20">Available</span>
                    </div>
                    <div class="grid grid-cols-2 gap-1.5">
            `;
            d.slots.forEach(s => {
                if (s.is_available) {
                    html += `
                        <button type="button" 
                                class="utc-book-slot-btn px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-emerald-500 hover:text-slate-950 text-slate-200 text-[10px] font-semibold border border-slate-700 transition-all text-center cursor-pointer shadow-sm"
                                data-date="${d.date_str}" data-slot="${s.slot_key}">
                            ${s.label}
                        </button>
                    `;
                }
            });
            html += `</div></div>`;
        });
        html += `</div></div>`;
        return html;
    }

    function renderBookingConfirmedCard(meta) {
        return `
            <div class="mt-2.5 p-3.5 rounded-2xl max-w-[94%] shadow-xl animate-fade-in text-left"
                 style="background-color: #0B0F19; border: 1px solid rgba(16, 185, 129, 0.6);">
                <div class="flex items-center justify-between gap-2 mb-2 pb-2 border-b border-emerald-500/30">
                    <span class="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 text-[10px] font-bold border border-emerald-500/40">Confirmed</span>
                    <span class="text-[10px] font-mono text-slate-300 font-bold">${meta.reference}</span>
                </div>
                <div class="space-y-1 text-[11px] text-slate-300">
                    <div>📅 <strong>Date:</strong> ${meta.date}</div>
                    <div>⏰ <strong>Time:</strong> ${meta.time} (EAT)</div>
                    <div>💻 <strong>Platform:</strong> ${meta.channel}</div>
                </div>
                <div class="mt-3 flex gap-2">
                    <a href="${meta.whatsapp_url}" target="_blank" 
                       class="flex-1 py-1.5 px-2 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-[10px] text-center flex items-center justify-center gap-1 transition-colors">
                        <i class="fa-brands fa-whatsapp"></i> Chat on WhatsApp
                    </a>
                </div>
            </div>
        `;
    }

    // Init Session
    function initSession() {
        fetch('/ai-assistant/api/init/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken()
            },
            body: JSON.stringify({ session_id: currentSessionId })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                currentSessionId = data.session_id;
                localStorage.setItem('utc_ai_session_id', currentSessionId);
                hasCapturedLead = data.has_lead;

                if (messagesBox) {
                    messagesBox.innerHTML = '';
                    data.messages.forEach(renderMessage);
                }
            }
        })
        .catch(() => {
            if (messagesBox) {
                messagesBox.innerHTML = '';
                renderMessage({
                    sender: 'assistant',
                    message: "Welcome to UniqueTechCamp! I am your 24/7 AI Solutions Architect. We develop/engineer high-converting web applications, 24/7 WhatsApp/Email qualification bots, clinic systems, and e-commerce platforms.",
                    created_at: 'Just now'
                });
            }
        });
    }

    // Toggle Modal & Synchronize Sessions
    function toggleWidget(open) {
        if (!modal) return;
        const willOpen = open !== undefined ? open : modal.classList.contains('hidden');
        if (willOpen) {
            modal.classList.remove('hidden');
            if (iconOpen) iconOpen.classList.add('hidden');
            if (iconClose) iconClose.classList.remove('hidden');
            if (launcher) launcher.setAttribute('aria-expanded', 'true');
            // Always sync with latest session state
            currentSessionId = localStorage.getItem('utc_ai_session_id') || currentSessionId;
            initSession();
            if (queryInput) queryInput.focus();
        } else {
            modal.classList.add('hidden');
            if (iconOpen) iconOpen.classList.remove('hidden');
            if (iconClose) iconClose.classList.add('hidden');
            if (launcher) launcher.setAttribute('aria-expanded', 'false');
        }
    }

    if (launcher) {
        launcher.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleWidget();
        });
    }

    if (closeBtn) {
        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleWidget(false);
        });
    }

    // Form Submit
    if (inputForm) {
        inputForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const message = (queryInput.value || '').trim();
            if (!message || isFetching) return;

            queryInput.value = '';
            renderMessage({ sender: 'user', message: message, created_at: 'Just now' });

            // Show Typing Indicator
            const typingIndicator = document.createElement('div');
            typingIndicator.id = 'utc-ai-typing';
            typingIndicator.className = 'flex items-center gap-1.5 text-slate-400 text-[11px] p-2';
            typingIndicator.innerHTML = `
                <div class="w-3.5 h-3.5 rounded bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-[9px]">
                    <i data-lucide="bot" class="w-2 h-2"></i>
                </div>
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-bounce"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-bounce" style="animation-delay: 0.15s"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-bounce" style="animation-delay: 0.3s"></span>
                <span class="ml-1 text-slate-400">Synthesizing solution...</span>
            `;
            messagesBox.appendChild(typingIndicator);
            if (window.lucide) lucide.createIcons();
            scrollToBottom();

            isFetching = true;
            if (sendBtn) sendBtn.disabled = true;

            fetch('/ai-assistant/api/message/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken()
                },
                body: JSON.stringify({
                    session_id: currentSessionId,
                    message: message
                })
            })
            .then(res => res.json())
            .then(data => {
                const typing = document.getElementById('utc-ai-typing');
                if (typing) typing.remove();
                isFetching = false;
                if (sendBtn) sendBtn.disabled = false;

                if (data.success) {
                    renderMessage({
                        sender: 'assistant',
                        message: data.reply,
                        action_type: data.action_type,
                        metadata: data.metadata,
                        created_at: 'Just now'
                    });
                }
            })
            .catch(() => {
                const typing = document.getElementById('utc-ai-typing');
                if (typing) typing.remove();
                isFetching = false;
                if (sendBtn) sendBtn.disabled = false;

                renderMessage({
                    sender: 'assistant',
                    message: "Our engineering desk is temporarily busy. Please contact our architects on WhatsApp at +254 715 479 955.",
                    created_at: 'Just now'
                });
            });
        });
    }

    // Quick Chips
    document.querySelectorAll('.utc-quick-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            const text = chip.getAttribute('data-text');
            if (text && queryInput) {
                queryInput.value = text;
                inputForm.dispatchEvent(new Event('submit'));
            }
        });
    });

    // Lead Form Submit
    document.addEventListener('submit', (e) => {
        if (e.target.matches('.utc-lead-form')) {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            if (submitBtn) submitBtn.disabled = true;

            const payload = {
                session_id: currentSessionId,
                full_name: e.target.querySelector('input[name="full_name"]').value.trim(),
                email: e.target.querySelector('input[name="email"]').value.trim(),
                phone: e.target.querySelector('input[name="phone"]').value.trim()
            };

            fetch('/ai-assistant/api/lead/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken()
                },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    hasCapturedLead = true;
                    e.target.closest('div').innerHTML = `
                        <div class="p-3 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-400 text-xs font-bold flex items-center gap-2">
                            <i data-lucide="check-circle" class="w-4 h-4"></i>
                            <span>Details registered! Thank you, ${payload.full_name}. What project can we scope for you?</span>
                        </div>
                    `;
                    if (window.lucide) lucide.createIcons();
                } else {
                    if (submitBtn) submitBtn.disabled = false;
                    alert(data.error || 'Registration failed.');
                }
            })
            .catch(() => {
                if (submitBtn) submitBtn.disabled = false;
                alert('Connection error.');
            });
        }
    });

    // Slot Selection
    document.addEventListener('click', (e) => {
        const slotBtn = e.target.closest('.utc-book-slot-btn');
        if (slotBtn) {
            const date = slotBtn.getAttribute('data-date');
            const slot = slotBtn.getAttribute('data-slot');

            slotBtn.disabled = true;
            slotBtn.innerHTML = 'Reserving...';

            fetch('/ai-assistant/api/book/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken()
                },
                body: JSON.stringify({
                    session_id: currentSessionId,
                    date: date,
                    slot_key: slot,
                    slot: slot
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    renderMessage({
                        sender: 'assistant',
                        message: data.reply,
                        action_type: data.action_type,
                        metadata: data.metadata,
                        created_at: 'Just now'
                    });
                } else {
                    slotBtn.disabled = false;
                    slotBtn.innerHTML = 'Retry';
                    alert(data.error || 'Booking slot unavailable.');
                }
            })
            .catch(() => {
                slotBtn.disabled = false;
                slotBtn.innerHTML = 'Retry';
                alert('Connection error.');
            });
        }
    });

    // Email Transcript (Dispatches to client's registered/profile email directly without popup)
    if (emailTranscriptBtn) {
        emailTranscriptBtn.addEventListener('click', () => {
            emailTranscriptBtn.disabled = true;
            const originalHtml = emailTranscriptBtn.innerHTML;
            emailTranscriptBtn.innerHTML = '<span class="animate-spin text-emerald-400">⏳</span>';

            fetch('/ai-assistant/api/transcript/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken()
                },
                body: JSON.stringify({ session_id: currentSessionId })
            })
            .then(res => res.json())
            .then(data => {
                emailTranscriptBtn.disabled = false;
                emailTranscriptBtn.innerHTML = originalHtml;
                if (window.lucide) lucide.createIcons();

                const statusEl = document.getElementById('utc-widget-transcript-status');
                if (data.success) {
                    if (statusEl) {
                        statusEl.textContent = '✓ Sent!';
                        statusEl.classList.remove('hidden');
                        setTimeout(() => statusEl.classList.add('hidden'), 5000);
                    } else {
                        alert(data.message || 'Transcript sent!');
                    }
                } else {
                    alert(data.error || 'Please provide your contact details in the chat first.');
                }
            })
            .catch(() => {
                emailTranscriptBtn.disabled = false;
                emailTranscriptBtn.innerHTML = originalHtml;
                if (window.lucide) lucide.createIcons();
                alert('Connection error. Please try again.');
            });
        });
    }

})();
</script>
{% endif %}
